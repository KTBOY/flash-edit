<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闪电Flash</title>
    <style>
      /*
       * 首屏骨架：必须是内联样式。
       * 应用样式（global.css / antd cssinjs）都由 JS 注入，首帧还没到位，
       * 这里若依赖它们就会出现「先空窗再啪地弹出」的闪烁。
       * 骨架是 #root 的兄弟节点：React 只接管 #root，互不干扰。
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #14161a;
        color: #fafae9;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.22s ease;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-mark {
        width: 11px;
        height: 11px;
        background: #c9ac67;
        transform: rotate(45deg);
        box-shadow: 0 0 14px rgba(201, 172, 103, 0.7);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot .boot-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 4px;
      }
      #boot .boot-sub {
        font-size: 8.5px;
        letter-spacing: 3px;
        color: rgba(201, 172, 103, 0.45);
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body style="background: #14161a">
    <div id="root"></div>
    <div id="boot">
      <span class="boot-mark"></span>
      <span class="boot-title">闪电Flash</span>
      <span class="boot-sub">SHAN DIAN FLASH</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
