<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>简单模式卡片 · 视觉稿</title>
<style>
  :root {
    --gold: #c9ac67;
    --gold-bright: #e6cf95;
    --gold-dim: rgba(201, 172, 103, 0.3);
    --cream: #fafae9;
    --cream-dim: rgba(250, 250, 233, 0.45);
    --bg-0: #14161a;
    --bg-1: #1b1e23;
    --card: rgba(255, 255, 255, 0.035);
    --hair: rgba(201, 172, 103, 0.2);
    --live: #6ee7a0;
    --ease: cubic-bezier(0.32, 0.72, 0.24, 1);
    --latin: 'Bahnschrift', 'DIN Alternate', 'Segoe UI', sans-serif;
    --zh-font: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 470px;
    font-family: var(--zh-font);
    color: var(--cream);
    background:
      radial-gradient(130% 80% at 100% 0%, rgba(201, 172, 103, 0.11), transparent 62%),
      linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
    position: relative;
  }

  /* 斜向扫描纹理 */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 5px);
    pointer-events: none;
  }
  /* 顶边金色发丝光线 */
  body::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), rgba(201, 172, 103, 0.35));
    z-index: 3;
  }

  .wrap { position: relative; padding: 6px 12px 16px; z-index: 1; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    padding: 0 2px;
  }
  .tab {
    position: relative;
    padding: 10px 2px 9px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--cream-dim);
  }
  .tab em {
    font: 400 8px/1 var(--latin);
    letter-spacing: 2px;
    color: var(--gold-dim);
    margin-left: 7px;
    font-style: normal;
    vertical-align: 1px;
  }
  .tab.active { color: var(--gold-bright); }
  .tab.active em { color: var(--gold); }
  .tab.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(201, 172, 103, 0.7);
  }

  /* ---------- HUD 卡片 ---------- */
  .hud-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--hair);
    padding: 13px 14px;
    margin-top: 12px;
  }
  .hud-card::before, .hud-card::after {
    content: '';
    position: absolute;
    width: 9px; height: 9px;
    border-color: var(--gold);
    pointer-events: none;
    z-index: 4;
  }
  .hud-card::before { left: -1px; top: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .hud-card::after { right: -1px; bottom: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-head .mk { width: 3px; height: 12px; background: var(--gold); flex: none; }
  .card-head .zh { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
  .card-head .ln { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .card-head .en { font: 400 8.5px/1 var(--latin); letter-spacing: 2.2px; color: var(--gold-dim); }

  /* ---------- 作弊卡片 ---------- */
  .cheat-list { display: flex; flex-direction: column; gap: 10px; }

  .cheat-card {
    position: relative;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(201, 172, 103, 0.14);
    padding: 10px 12px 11px 15px;
  }
  .cheat-card::before {
    content: '';
    position: absolute;
    left: -1px; top: -1px; bottom: -1px;
    width: 3px;
    background: var(--gold-dim);
  }

  .cc-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .cc-diamond {
    width: 7px; height: 7px; flex: none;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(201, 172, 103, 0.7);
  }
  .cc-name b { display: block; font-size: 14px; font-weight: 600; letter-spacing: 2px; line-height: 1.1; }
  .cc-name i {
    display: block;
    font: 400 8px/1 var(--latin);
    letter-spacing: 2.2px;
    color: var(--gold-dim);
    margin-top: 3px;
    font-style: normal;
  }
  .cc-spacer { flex: 1; }

  .cc-now { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .cc-now .num {
    font: 700 20px/1 var(--latin);
    color: var(--gold-bright);
    letter-spacing: 0.5px;
    text-shadow: 0 0 14px rgba(201, 172, 103, 0.4);
  }
  .cc-now .lbl { font-size: 10px; letter-spacing: 2px; color: var(--cream-dim); }

  .cc-tag {
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 2px 7px;
    border: 1px solid rgba(110, 231, 160, 0.3);
    color: var(--live);
    background: rgba(110, 231, 160, 0.06);
  }
  .cc-tag.stale {
    border-color: rgba(255, 255, 255, 0.16);
    color: var(--cream-dim);
    background: rgba(0, 0, 0, 0.25);
  }

  /* 锁定态：整卡金化 */
  .cheat-card.locked {
    border-color: rgba(201, 172, 103, 0.45);
    background: rgba(201, 172, 103, 0.06);
    box-shadow: 0 0 22px rgba(201, 172, 103, 0.1), inset 0 0 30px rgba(201, 172, 103, 0.04);
  }
  .cheat-card.locked::before { background: var(--gold); box-shadow: 0 0 8px rgba(201, 172, 103, 0.8); }

  /* 失效态 */
  .cheat-card.stale { opacity: 0.6; }
  .cheat-card.stale::before { background: rgba(255, 255, 255, 0.12); }

  /* ---------- 操作行 ---------- */
  .cc-row { display: flex; align-items: center; gap: 8px; }

  .cc-input {
    width: 140px;
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    background: rgba(0, 0,0, 0.32);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font: 600 14px/1 var(--latin);
    letter-spacing: 1px;
    color: var(--cream);
  }
  .cc-input:focus-within { border-color: var(--gold); }
  .cc-input.muted { color: var(--cream-dim); border-style: dashed; }

  .cc-apply {
    height: 32px;
    padding: 0 20px;
    border: none;
    background: var(--gold);
    color: #14161a;
    font-family: var(--zh-font);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-indent: 3px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(201, 172, 103, 0.3);
  }
  .cc-apply.ghost {
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold-bright);
    box-shadow: none;
    letter-spacing: 2px;
    text-indent: 2px;
    padding: 0 14px;
  }

  .cc-lock-group { display: flex; align-items: center; gap: 6px; margin-left: 4px; }
  .cc-switch {
    width: 34px; height: 17px;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(0, 0, 0, 0.3);
  }
  .cc-switch .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 11px; height: 11px;
    background: var(--cream-dim);
  }
  .cc-switch.on { border-color: var(--gold); background: rgba(201, 172, 103, 0.35); }
  .cc-switch.on .knob { left: auto; right: 2px; background: var(--gold-bright); box-shadow: 0 0 8px rgba(201, 172, 103, 0.9); }
  .cc-lock-txt { font-size: 11px; letter-spacing: 1px; color: var(--cream-dim); }
  .cc-lock-txt.on { color: var(--gold-bright); }

  .cc-del {
    margin-left: auto;
    width: 24px; height: 24px;
    border: none;
    background: none;
    color: var(--cream-dim);
    font-size: 12px;
    cursor: pointer;
  }
  .cc-del:hover { color: #ff6b5e; background: rgba(255, 107, 94, 0.1); }

  /* ---------- 添加按钮 ---------- */
  .add-card {
    margin-top: 10px;
    height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 1px dashed rgba(201, 172, 103, 0.35);
    background: rgba(201, 172, 103, 0.03);
    cursor: pointer;
  }
  .add-card .t { font-size: 13px; font-weight: 600; letter-spacing: 2.5px; color: var(--gold-bright); }
  .add-card .s { font-size: 10px; letter-spacing: 1.5px; color: var(--cream-dim); }

  .hint {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--cream-dim);
  }
  .hint b { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Tabs：一键修改（默认）/ 高级工具 -->
    <div class="tabs">
      <div class="tab active">一键修改<em>QUICK EDIT</em></div>
      <div class="tab">高级工具<em>EXPERT TOOLS</em></div>
    </div>

    <!-- 修改卡片 -->
    <section class="hud-card">
      <header class="card-head">
        <span class="mk"></span>
        <span class="zh">修改卡片</span>
        <span class="ln"></span>
        <span class="en">CHEAT CARDS</span>
      </header>

      <div class="cheat-list">
        <!-- 金币：锁定态 -->
        <article class="cheat-card locked">
          <div class="cc-top">
            <span class="cc-diamond"></span>
            <div class="cc-name"><b>金币</b><i>COINS</i></div>
            <span class="cc-spacer"></span>
            <div class="cc-now"><span class="num">99,999</span><span class="lbl">当前</span></div>
            <span class="cc-tag">已锁定</span>
          </div>
          <div class="cc-row">
            <div class="cc-input">99999</div>
            <button class="cc-apply">修改</button>
            <div class="cc-lock-group">
              <div class="cc-switch on"><span class="knob"></span></div>
              <span class="cc-lock-txt on">锁定</span>
            </div>
            <button class="cc-del">✕</button>
          </div>
        </article>

        <!-- 血量：普通态 -->
        <article class="cheat-card">
          <div class="cc-top">
            <span class="cc-diamond" style="background: var(--gold-dim); box-shadow: none;"></span>
            <div class="cc-name"><b>血量</b><i>HEALTH</i></div>
            <span class="cc-spacer"></span>
            <div class="cc-now"><span class="num">87</span><span class="lbl">当前</span></div>
          </div>
          <div class="cc-row">
            <div class="cc-input">999</div>
            <button class="cc-apply">修改</button>
            <div class="cc-lock-group">
              <div class="cc-switch"><span class="knob"></span></div>
              <span class="cc-lock-txt">锁定</span>
            </div>
            <button class="cc-del">✕</button>
          </div>
        </article>

        <!-- 防御：失效态 -->
        <article class="cheat-card stale">
          <div class="cc-top">
            <span class="cc-diamond" style="background: rgba(250,250,233,.2); box-shadow: none;"></span>
            <div class="cc-name"><b>防御</b><i>DEFENSE</i></div>
            <span class="cc-spacer"></span>
            <div class="cc-now"><span class="num" style="color: var(--cream-dim); text-shadow: none;">—</span><span class="lbl">当前</span></div>
            <span class="cc-tag stale">已失效</span>
          </div>
          <div class="cc-row">
            <div class="cc-input muted">——</div>
            <button class="cc-apply ghost">重新定位</button>
            <button class="cc-del">✕</button>
          </div>
        </article>
      </div>

      <!-- 添加新修改（进入三步向导） -->
      <div class="add-card">
        <span class="t">＋ 添加新修改</span>
        <span class="s">三步引导 · 自动定位地址 · 金币 / 血量 / 分数</span>
      </div>

      <div class="hint"><b>锁定</b> = 持续写回该数值，游戏无法改回去</div>
    </section>
  </div>
</body>
</html>
