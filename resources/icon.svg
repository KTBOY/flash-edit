<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1b1e23"/>
      <stop offset="0.62" stop-color="#14161a"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="tint" cx="1" cy="0" r="1.1">
      <stop offset="0" stop-color="#c9ac67" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#c9ac67" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f0dcae"/>
      <stop offset="0.5" stop-color="#e6cf95"/>
      <stop offset="1" stop-color="#c9ac67"/>
    </linearGradient>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="1" height="5" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#c9ac67" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#tint)"/>
  <rect width="512" height="512" fill="url(#scan)"/>

  <!-- 发丝内框 -->
  <rect x="28.5" y="28.5" width="455" height="455" fill="none" stroke="#c9ac67" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- L 形四角角标 -->
  <g fill="none" stroke="#c9ac67" stroke-width="6">
    <path d="M28 78 V28 H78"/>
    <path d="M434 28 H484 V78"/>
    <path d="M484 434 V484 H434"/>
    <path d="M78 484 H28 V434"/>
  </g>

  <!-- 菱形外框（HUD 节点母题） -->
  <path d="M256 66 L426 236 L256 406 L86 236 Z" fill="none" stroke="#c9ac67" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 点阵括号 -->
  <g fill="#c9ac67" opacity="0.55">
    <rect x="60" y="216" width="4" height="4"/><rect x="60" y="223" width="4" height="4"/><rect x="60" y="230" width="4" height="4"/>
    <rect x="67" y="216" width="4" height="4"/><rect x="67" y="223" width="4" height="4"/><rect x="67" y="230" width="4" height="4"/>
    <rect x="441" y="216" width="4" height="4"/><rect x="441" y="223" width="4" height="4"/><rect x="441" y="230" width="4" height="4"/>
    <rect x="448" y="216" width="4" height="4"/><rect x="448" y="223" width="4" height="4"/><rect x="448" y="230" width="4" height="4"/>
  </g>

  <!-- 闪电主体 -->
  <path d="M296 52 L158 262 L238 262 L210 420 L356 198 L272 198 Z" fill="url(#bolt)" filter="url(#glow)"/>

  <!-- 底部拉丁标 -->
  <text x="260" y="464" text-anchor="middle" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="26" letter-spacing="12" fill="#c9ac67" fill-opacity="0.6">TRAINER</text>
</svg>
